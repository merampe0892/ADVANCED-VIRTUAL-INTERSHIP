<!DOCTYPE html>
<html lang="en">
    <style>
    .card {
  position: relative;
  width: 250px;
  height: 150px;
  overflow: scroll;
  z-index: 100;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  background-color: rgba(220, 20, 60, 0.9);
  color: white;
  padding: 10px;
  z-index: 10;
}</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
  <img src="https://via.placeholder.com/250x150" alt="Product">
  <div class="overlay">SALE</div>
</div>
    
</body>
</html>
